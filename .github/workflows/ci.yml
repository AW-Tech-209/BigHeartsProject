name: CI

# Se ejecuta en cada Pull Request hacia main y en los push a main.
# Los checks de PR son los que, con la protección de rama activada, bloquean el
# merge si fallan (ver DEPLOYMENT.md → Protección de rama).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si se empuja varias veces al mismo PR, cancela las ejecuciones anteriores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Husky instala hooks de git en el `prepare`; en CI no hacen falta.
  HUSKY: 0

jobs:
  # ── Backend (tarea Dev A) ───────────────────────────────────────────────────
  backend:
    name: Backend (lint + build + test)
    runs-on: ubuntu-latest
    # HU-308: los tests de @academia/api verifican el índice de `bookings`
    # contra una BD real, y `prisma migrate diff` necesita una a la que
    # aplicar las migraciones para comparar.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: academia
          POSTGRES_DB: academia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academia -d academia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://academia:academia@localhost:5432/academia
      DIRECT_URL: postgresql://academia:academia@localhost:5432/academia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` borra node_modules y vuelve a enlazar decenas de miles de
      # archivos: en este monorepo son minutos aunque no descargue nada. Con la
      # caché, un lockfile sin cambios salta el paso entero.
      #
      # La clave incluye `schema.prisma` porque el postinstall genera el cliente
      # DENTRO de node_modules: si el schema cambia sin tocar el lockfile, un
      # cliente cacheado quedaría obsoleto y el build compilaría contra tipos
      # viejos. El sufijo `prisma` separa esta caché de la del job de frontend,
      # que se genera SIN cliente (ver allí) — compartir clave le daría a este
      # job un node_modules sin `@prisma/client` y el build fallaría.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-prisma-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/api/prisma/schema.prisma') }}

      # Instala TODO el monorepo (workspaces) de forma reproducible desde el
      # package-lock.json de la raíz. Su postinstall genera el cliente de Prisma
      # (offline, no necesita base de datos).
      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

      # Las apps importan @academia/types compilado; hay que construirlo antes.
      - name: Build shared types
        run: npm run build:types

      - name: Lint
        run: npx eslint apps/api

      - name: Build
        run: npm run build --workspace @academia/api

      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # AC1/AC5: si el schema vuelve a divergir de las migraciones aplicadas
      # (por ejemplo, reintroduciendo `@@unique` sobre `bookings`), esto falla.
      - name: Check schema drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --exit-code

      - name: Test
        run: npm run test --workspace @academia/api

  # ── Frontend + tipos compartidos (tarea Dev B) ──────────────────────────────
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    env:
      # `npm ci` instala el monorepo entero, así que el postinstall de
      # @academia/api dispararía `prisma generate` —y la descarga de sus motores,
      # decenas de megas— en un job que no toca Prisma para nada. @academia/types
      # NO importa de `@prisma/client`: declara sus enums como gemelos del schema,
      # así que aquí el cliente no hace falta.
      PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Caché propia: este node_modules se instala SIN cliente de Prisma, así que
      # no puede compartir clave con la del backend (ver el comentario de allí).
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-noprisma-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build shared types
        run: npm run build:types

      - name: Lint
        run: npx eslint apps/web

      # `build` del frontend hace `tsc --noEmit` (typecheck) + `vite build`.
      - name: Build
        run: npm run build --workspace @academia/web

      # Los tests de @academia/types viven en este job porque es el único que
      # los tiene ya compilados y porque quien toca el contrato suele venir del
      # frontend. Son funciones puras: segundos, no minutos.
      - name: Test shared types
        run: npm run test --workspace @academia/types

      # Vitest + Testing Library + axe sobre jsdom (ARQUITECTURA.md §10.2, D17).
      # Bloquea el merge: un test que no bloquea no existe.
      - name: Test
        run: npm run test --workspace @academia/web
