# Entorno de desarrollo local de Academia.
#
# Objetivo: `docker compose up` levanta el stack completo, reproducible e
# idéntico entre los dos miembros del equipo, sin pasos manuales.
#
# Estrategia de base de datos: en DESARROLLO usamos este PostgreSQL en
# contenedor (aislado por dev, desechable, rápido). Supabase queda reservado
# para staging/producción; sus credenciales viven en el .env de cada quien, no
# aquí. La imagen se pinea a la MISMA major que Supabase (17) para no introducir
# deriva de versión.
#
# Todas las variables tienen valor por defecto (${VAR:-default}), así que el
# stack arranca sin configuración previa. Puedes sobrescribirlas con un `.env`
# en la raíz del repo si lo necesitas.

name: academia

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: academia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academia}
      POSTGRES_DB: ${POSTGRES_DB:-academia}
    ports:
      # Publicado al host para poder correr la API en local (fuera de Docker)
      # o inspeccionar la BD con un cliente como TablePlus/psql.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Volumen con nombre = los datos sobreviven a `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # La API no arranca hasta que la BD acepta conexiones (ver depends_on).
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-academia} -d ${POSTGRES_DB:-academia}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (NestJS) ───────────────────────────────────────────────────────
  api:
    build:
      # Contexto = raíz del monorepo: la imagen necesita los tres workspaces.
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: academia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # Hot-reload en Docker sobre Windows/macOS: los eventos inotify no cruzan
      # el bind-mount, así que forzamos el watcher de TypeScript a hacer polling.
      # Sin esto, `nest start --watch` no ve los cambios del host.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      # En dev el secreto no es sensible; en staging/prod va por el entorno real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-no-usar-en-produccion-1234}
      # Clave AES-256-GCM del enlace de reunión (64 hex = 32 bytes). El valor de
      # dev es fijo A PROPÓSITO: si cambiara en cada `up`, los enlaces sembrados
      # o creados ayer dejarían de descifrarse y parecería un bug del cifrado.
      # En staging/prod va por secreto real (`openssl rand -hex 32`).
      MEETING_LINK_KEY: ${MEETING_LINK_KEY:-6465762d6f6e6c792d6d656574696e672d6c696e6b2d6b65792d6e6f2d70726f}
      # Dentro de la red de Docker, la BD se resuelve por el nombre del servicio
      # (`postgres`), no por localhost. Sin pooler, así que url y directUrl
      # apuntan al mismo sitio.
      DATABASE_URL: postgresql://${POSTGRES_USER:-academia}:${POSTGRES_PASSWORD:-academia}@postgres:5432/${POSTGRES_DB:-academia}
      DIRECT_URL: postgresql://${POSTGRES_USER:-academia}:${POSTGRES_PASSWORD:-academia}@postgres:5432/${POSTGRES_DB:-academia}
      # Registro: profesores PENDING por defecto.
      TEACHER_APPROVAL_REQUIRED: ${TEACHER_APPROVAL_REQUIRED:-true}
      # Credenciales del Admin del seed (valores de DEV; en prod van por secretos).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@academia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      # Hot-reload: el código fuente del host se monta en el contenedor, así que
      # `nest start --watch` recompila al guardar. node_modules y dist NO se
      # montan (se quedan los de la imagen), por eso solo montamos src y prisma.
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    # Al arrancar: aplica migraciones, siembra datos de prueba (idempotente) y
    # levanta el backend en modo watch. Todo automático, sin pasos manuales.
    # Se usan los scripts del workspace para que el cwd sea apps/api y Prisma
    # encuentre prisma/schema.prisma.
    command: >
      sh -c "npm run prisma:deploy --workspace @academia/api &&
             npm run db:seed --workspace @academia/api &&
             npm run dev --workspace @academia/api"

  # ── Frontend (Vite) ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: academia-web
    restart: unless-stopped
    depends_on:
      # Solo para ordenar el arranque; la web funciona aunque la API tarde
      # (el health-check de la home reintenta a mano).
      - api
    environment:
      # OJO: esta URL la usa el NAVEGADOR del host, no el contenedor. Por eso es
      # localhost:3000 (el puerto publicado de la API) y NO http://api:3000, que
      # solo resuelve dentro de la red de Docker. El SPA corre en el navegador.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      # Hot-reload en Docker sobre Windows/macOS: el watcher de Vite (chokidar)
      # no recibe eventos inotify a través del bind-mount, así que hace polling.
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      # Hot-reload: montamos el código del host. node_modules se queda el de la
      # imagen (no lo montamos), por eso solo van src e index.html.
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html

volumes:
  postgres-data:
