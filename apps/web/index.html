<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia</title>
    <script>
      try {
        var tema = localStorage.getItem('bighearts:tema');
        if (tema === 'oscuro') document.documentElement.classList.add('dark');
        else if (tema === 'alto-contraste') document.documentElement.classList.add('hc');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
